<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — AdminPanel</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- ── Page Loader ─────────────────────────────────────── -->
  <div id="pageLoader" class="page-loader">
    <div class="spinner spinner-lg"></div>
    <div class="page-loader-text">Loading…</div>
  </div>

  <!-- ── Toast Container ─────────────────────────────────── -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- ── Auth Page ───────────────────────────────────────── -->
  <div class="auth-page">
    <div class="auth-bg-shape"></div>

    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <div class="auth-logo-icon">
          <i class="fa-solid fa-layer-group"></i>
        </div>
        <span class="auth-logo-name">AdminPanel</span>
      </div>

      <!-- Heading -->
      <div class="auth-title">Selamat datang kembali</div>
      <div class="auth-subtitle">Masukkan kredensial Anda untuk melanjutkan.</div>

      <!-- Form -->
      <!-- In Laravel: <form method="POST" action="{{ route('login') }}"> -->
      <!-- @csrf -->
      <div class="form-group">
        <label class="form-label" for="email">
          Alamat Email <span class="required">*</span>
        </label>
        <div class="input-group">
          <i class="fa-solid fa-envelope input-group-icon"></i>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="anda@perusahaan.com"
            autocomplete="email"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">
          Kata Sandi <span class="required">*</span>
        </label>
        <div class="input-group" style="position:relative;">
          <i class="fa-solid fa-lock input-group-icon"></i>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="Masukkan kata sandi"
            autocomplete="current-password"
            required
            style="padding-right: 42px;"
          />
          <button
            type="button"
            class="show-password-toggle"
            data-target="password"
            aria-label="Toggle password visibility"
          >
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="d-flex align-center justify-between mb-16" style="margin-bottom: 22px;">
        <label class="form-check">
          <input type="checkbox" name="remember" class="form-check-input" />
          <span class="form-check-label">Ingat saya</span>
        </label>
        <a href="#" style="font-size:13px; font-weight:600; color:var(--primary);">
          Lupa kata sandi?
        </a>
      </div>

      <button
        type="button"
        class="btn btn-primary w-full btn-lg"
        id="loginBtn"
        onclick="handleLogin()"
      >
        <i class="fa-solid fa-arrow-right-to-bracket"></i>
        Masuk
      </button>

      <div class="auth-footer-text">
        Belum punya akun? <a href="#">Hubungi administrator</a>
      </div>

    </div><!-- /.auth-card -->
  </div><!-- /.auth-page -->

  <script src="app.js"></script>
  <script>
    function handleLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('loginBtn');

      if (!email || !password) {
        Toast.warning('Form Tidak Lengkap', 'Harap isi email dan kata sandi.');
        return;
      }

      // Simulate loading state
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner spinner-white"></div> Memproses…';

      // Simulate API call — in Laravel, use <form> submit or axios.post()
      setTimeout(() => {
        // Success → redirect to dashboard
        Toast.success('Login Berhasil', 'Selamat datang kembali!');
        setTimeout(() => { window.location.href = 'index.html'; }, 800);
      }, 1500);
    }

    // Allow Enter key to submit
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>

</body>
</html>
